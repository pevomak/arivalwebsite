 <script>
 const Engine = {
  state: 'LANG1', 
  vantaInstance: null,
  graph: JSON.parse(document.getElementById('semantic-graph').text),

  init: function() {
   document.getElementById('current-year').textContent = new Date().getFullYear();
   this.initTheme();
   this.initVanta();
   this.renderSwitcher();
   this.render();
  },

  initTheme: function() {
   const toggleBtn = document.getElementById('theme-toggle');
   toggleBtn.addEventListener('click', () => {
    document.documentElement.classList.toggle('dark');
    this.updateVantaTheme();
   });
  },

  initVanta: function() {
   if (typeof VANTA === 'undefined' || !VANTA.NET) return;
   
   const isDark = document.documentElement.classList.contains('dark');
   const anim = this.graph.theme.animation;
   
   try {
    this.vantaInstance = VANTA.NET({
     el: "#vanta-bg",
     mouseControls: true,
     touchControls: true,
     gyroControls: false,
     minHeight: 200.00,
     minWidth: 200.00,
     scale: 1.00,
     scaleMobile: 1.00,
     color: parseInt(anim.baseColor.replace('#', '0x'), 16),
     backgroundColor: parseInt((isDark ? anim.bgDark : anim.bgLight).replace('#', '0x'), 16),
     points: 12.00,
     maxDistance: 22.00,
     spacing: 18.00
    });
   } catch(e) {
    console.error("Vanta initialization error:", e);
   }
  },

  updateVantaTheme: function() {
   if (!this.vantaInstance) return;
   const isDark = document.documentElement.classList.contains('dark');
   const anim = this.graph.theme.animation;
   this.vantaInstance.setOptions({
    backgroundColor: parseInt((isDark ? anim.bgDark : anim.bgLight).replace('#', '0x'), 16)
   });
  },

  renderSwitcher: function() {
   const container = document.getElementById('lang-switcher');
   container.innerHTML = '';
   
   Object.keys(this.graph.languages).forEach(key => {
    const lang = this.graph.languages[key];
    const btn = document.createElement('button');
    btn.className = `px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
     this.state === key 
      ? 'bg-blue-600 text-white shadow' 
      : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
    }`;
    btn.textContent = lang.label;
    btn.onclick = () => {
     this.state = key;
     this.renderSwitcher();
     this.render();
    };
    container.appendChild(btn);
   });
  },

  render: function() {
   const mount = document.getElementById('main-mount');
   mount.innerHTML = '';
   
   const langData = this.graph.languages[this.state].content;
   const identity = this.graph.identity;
   const registry = this.graph.registry;

   // Update Page Meta
   document.title = langData.SEO.TITLE;
   document.getElementById('meta-desc').setAttribute('content', langData.SEO.DESC);

   this.graph.components.forEach(comp => {
    if (comp.type === 'HERO') {
     const tpl = document.getElementById('tpl-hero').innerHTML;
     const rendered = tpl
      .replace('{{H1}}', langData.HERO.H1)
      .replace('{{P}}', langData.HERO.P)
      .replace('{{PHONE}}', identity.phone);
     
     const div = document.createElement('div');
     div.innerHTML = rendered;
     mount.appendChild(div);
    } 
    else if (comp.type === 'SERVICES') {
     const tpl = document.getElementById('tpl-services').innerHTML;
     const rendered = tpl
      .replace('{{SECTION_TITLE}}', langData.SERVICES_TITLE)
      .replace('[ID]', comp.id);
     
     const div = document.createElement('div');
     div.innerHTML = rendered;
     mount.appendChild(div);

     const grid = document.getElementById(`services-grid-${comp.id}`);
     langData.SERVICES.forEach(service => {
      const card = document.createElement('div');
      card.className = "bg-white dark:bg-slate-900 p-8 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 flex flex-col items-start";
      
      let iconName = service.ICON || 'hard-hat';
      if(iconName === 'laptop') iconName = 'compass';
      if(iconName === 'megaphone') iconName = 'building';
      if(iconName === 'hammer') iconName = 'hard-hat';

      card.innerHTML = `
       <div class="p-4 bg-blue-600/10 text-blue-600 dark:text-blue-400 rounded-2xl mb-6">
        <i data-lucide="${iconName}" class="w-8 h-8"></i>
       </div>
       <h3 class="text-xl font-bold text-slate-900 dark:text-white mb-3">${service.TITLE}</h3>
       <p class="text-slate-600 dark:text-slate-400 text-sm leading-relaxed">${service.DESC}</p>
      `;
      grid.appendChild(card);
     });
    }
    else if (comp.type === 'COMPANY_DATA') {
     const tpl = document.getElementById('tpl-registry').innerHTML;
     const rendered = tpl
      .replace('{{REGISTRY_TITLE}}', langData.UI.REGISTRY_TITLE)
      .replace('{{LBL_LEGAL}}', langData.UI.LBL_LEGAL)
      .replace('{{LBL_NAME}}', langData.UI.LBL_NAME)
      .replace('{{LEGAL_NAME}}', identity.legalName)
      .replace('{{ICO}}', identity.ico)
      .replace('{{VAT_NUMBER}}', registry.vatNumber)
      .replace('{{VAT_STATUS}}', registry.vatStatus)
      .replace('{{FACEBOOK}}', registry.facebook)
      .replace('{{LBL_ECO}}', langData.UI.LBL_ECO)
      .replace('{{LBL_REGISTRAR}}', langData.UI.LBL_REGISTRAR)
      .replace('{{REGISTRAR}}', registry.registrar)
      .replace('{{LBL_PARTNERS}}', langData.UI.LBL_PARTNERS)
      .replace('[ID]', comp.id);

     const div = document.createElement('div');
     div.innerHTML = rendered;
     mount.appendChild(div);

     const partnersContainer = document.getElementById(`partners-${comp.id}`);
     registry.partners.forEach(partner => {
      const tag = document.createElement('span');
      tag.className = "px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700 flex items-center gap-1.5";
      tag.innerHTML = `<i data-lucide="user-check" class="w-3.5 h-3.5 text-blue-600"></i> ${partner}`;
      partnersContainer.appendChild(tag);
     });
    }
   });

   // Re-initialize Lucide Icons
   if (window.lucide) {
    lucide.createIcons();
   }
  }
 };

 window.onload = function() {
  Engine.init();
 };
 </script>
